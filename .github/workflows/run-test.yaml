name: Run tests

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - 'infrastructure/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Java
      # ---------------------------------------------------------
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      # ---------------------------------------------------------
      # Docker services
      # ---------------------------------------------------------
      - name: Set up services
        run: |
          cd infrastructure/docker_compose
          chmod +x restart-docker.sh
          ./restart-docker.sh

      # ---------------------------------------------------------
      # Maven
      # ---------------------------------------------------------
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # ---------------------------------------------------------
      # Run tests
      # ---------------------------------------------------------
      - name: Run tests
        run: ./mvnw clean test
        env:
          APIBASEURL: http://localhost:4111
          UIBASEURL: http://frontend
          APIVERSION: /api/v1

      # ---------------------------------------------------------
      # Install Swagger Coverage
      # ---------------------------------------------------------
      - name: Install Swagger Coverage
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f swagger-coverage-1.5.0.zip ]; then
            echo "swagger-coverage-1.5.0.zip is not in the repo, skip"
            exit 0
          fi
          unzip -o swagger-coverage-1.5.0.zip -d .swagger-coverage-commandline
          chmod +x .swagger-coverage-commandline/bin/swagger-coverage-commandline

      # ---------------------------------------------------------
      # Swagger Coverage
      # ---------------------------------------------------------
      - name: Run Swagger coverage
        if: always()
        continue-on-error: true
        run: |
          if [ ! -x .swagger-coverage-commandline/bin/swagger-coverage-commandline ]; then
            echo "Swagger coverage CLI is not installed, skip"
            exit 0
          fi
          .swagger-coverage-commandline/bin/swagger-coverage-commandline \
            -s http://localhost:4111/v3/api-docs \
            -i target/swagger-coverage-output

      # ---------------------------------------------------------
      # Load previous Allure history
      # ---------------------------------------------------------
      - name: Load test report history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # ---------------------------------------------------------
      # Build Allure report (no Docker action — v1.11 image build fails)
      # ---------------------------------------------------------
      - name: Build test report
        if: always()
        run: |
          ALLURE_VERSION=2.32.0
          wget -q -O /tmp/allure.tgz \
            "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz"
          sudo tar -xzf /tmp/allure.tgz -C /opt
          sudo ln -sf "/opt/allure-${ALLURE_VERSION}/bin/allure" /usr/local/bin/allure

          mkdir -p "allure-history/${{ github.run_number }}"
          RESULTS=target/allure-results

          if [ ! -d "$RESULTS" ] || [ -z "$(ls -A "$RESULTS" 2>/dev/null)" ]; then
            echo "No allure-results found, skipping generate"
            echo "<html><body>No Allure results for run ${{ github.run_number }}</body></html>" \
              > "allure-history/${{ github.run_number }}/index.html"
            exit 0
          fi

          LAST_HISTORY=$(find gh-pages -type d -name history 2>/dev/null | sort | tail -1 || true)
          if [ -n "$LAST_HISTORY" ]; then
            mkdir -p "$RESULTS/history"
            cp -r "$LAST_HISTORY/." "$RESULTS/history/" || true
          fi

          allure generate "$RESULTS" --clean -o allure-report
          cp -r allure-report/. "allure-history/${{ github.run_number }}/"
          if [ -d allure-report/history ]; then
            rm -rf allure-history/last-history
            cp -r allure-report/history allure-history/last-history
          fi

      # ---------------------------------------------------------
      # Add Swagger Coverage report to Allure history
      # ---------------------------------------------------------
      - name: Build Swagger coverage report
        if: always()
        run: |
          mkdir -p allure-history/${{ github.run_number }}

          if [ -f swagger-coverage-report.html ]; then
            cp swagger-coverage-report.html \
              allure-history/${{ github.run_number }}/swagger-coverage-report.html
          else
            echo "Swagger coverage report was not generated"
          fi

      # ---------------------------------------------------------
      # Publish reports to GitHub Pages
      # ---------------------------------------------------------
      - name: Publish test report
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # ---------------------------------------------------------
      # Cleanup
      # ---------------------------------------------------------
      - name: Clean up services
        if: always()
        run: |
          if [ -f infrastructure/docker_compose/docker-compose.yml ]; then
            docker compose -f infrastructure/docker_compose/docker-compose.yml down || true
          else
            echo "Compose file not present, skip docker compose down"
          fi